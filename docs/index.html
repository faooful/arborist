<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>Arborist: your git worktrees, as leaves</title>
<meta name="description" content="Visualise your worktrees and sweep away the ones you don't need.">
<style>
@font-face{font-family:"Fraunces";src:url(assets/fonts/fraunces-latin.woff2) format("woff2");font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-latin.woff2) format("woff2");font-weight:400 600;font-style:normal;font-display:swap}
:root{
  --ground:#efeadf; --paper:#f6f3ec; --moss:#7d8a6a; --moss-deep:#4a5640; --sage:#c9d0bd; --tan:#c9a97e; --deps:#e4e6d3;
  --ink:#3f4a35; --ink-2:#6f7262; --ink-3:#a19c88;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0}
html{background:#5a684c;color:var(--ink);font:16px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{position:relative;height:100vh;height:100dvh;overflow:hidden;padding:var(--inset)}
:root{--inset:clamp(8px,1vw,12px);--sh:calc(100dvh - 2*var(--inset));--pw:min(572px,calc((var(--sh) - 120px)*.734),52vw)}

/* full-bleed dithered foliage scene, 16px oversize on every side so the drift never shows an edge */
#scene{position:absolute;top:-8px;left:-8px;width:calc(100% + 16px);height:calc(100% + 16px);z-index:0;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
/* rounded inset stage: the canopy and floor colour read as a frame around it */
.stage{position:relative;z-index:2;height:var(--sh);border-radius:22px;padding:0 clamp(24px,4.5vw,72px);
  overflow:hidden;isolation:isolate;box-shadow:0 0 0 .5px #3f4a3540;
  display:grid;grid-template-columns:minmax(0,560px) var(--pw);justify-content:center;column-gap:clamp(40px,6vw,96px);align-items:center}
.copy,.extra{position:relative;z-index:2}.copy{padding:0 0 3dvh}
h1{font-family:"Fraunces",ui-serif,Georgia,serif;font-size:clamp(44px,min(7vw,12dvh),104px);line-height:.92;letter-spacing:-.03em;font-weight:440;font-variation-settings:"opsz" 144;color:var(--moss-deep)}
.tag{font-size:17px;line-height:1.5;letter-spacing:-.005em;color:#4f5844;margin-top:clamp(12px,2.4dvh,22px);max-width:21em}
.cta{display:inline-flex;align-items:center;gap:12px;margin-top:clamp(18px,3.4dvh,32px);height:46px;padding:0 22px 0 2px;white-space:nowrap;border-radius:999px;background:var(--moss-deep);color:#fbf8ef;font-size:15px;font-weight:550;text-decoration:none;
  box-shadow:0 1px 0 #ffffff26 inset,0 1px 2px #4a564033;transition:background .16s var(--ease),transform .16s var(--ease)}
.cta .ic{width:42px;height:42px;border-radius:50%;background:#fbf8ef;color:var(--moss-deep);display:grid;place-items:center}
.cta:hover{background:#56644a}.cta:active{transform:translateY(1px)}
.cta:focus-visible{outline:2px solid var(--moss);outline-offset:3px}

/* menu-bar extra: icon, caret, popover */
.extra{position:relative;display:flex;flex-direction:column;align-items:flex-end;width:var(--pw)}
.icon{cursor:pointer;border:0;font:inherit;padding:0;transition:transform .16s var(--ease);width:84px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:3px;background:#f6f3ec;box-shadow:0 0 0 .5px #4a564040,0 2px 6px #4a564026;margin-right:30px}
.icon .gb{font-size:13px;font-weight:500;letter-spacing:-.01em;color:#3f4a35;font-variant-numeric:tabular-nums}
.pop{margin-top:8px;width:100%;position:relative;transform-origin:calc(100% - 72px) 0;
  filter:drop-shadow(0 24px 40px #4a564030) drop-shadow(0 2px 6px #4a56401a)}
.pop .caret{position:absolute;z-index:2;top:-9px;right:63px;width:18px;height:10px;display:block;overflow:visible}
.pop .panel{display:block;width:100%;height:auto;aspect-ratio:480/654;border-radius:14px;box-shadow:0 0 0 .5px #4a564038;overflow:hidden;background:#f6f3ec}
.pop .panel svg{display:block;width:100%;height:100%}
.pop{transition:opacity .22s var(--ease),transform .26s var(--ease)}
.pop.shut{opacity:0;transform:scale(.94) translateY(-6px);pointer-events:none}
.icon:active{transform:translateY(1px)}.icon:focus-visible{outline:2px solid var(--moss);outline-offset:3px}
/* live panel */
.lf{transform-box:fill-box;transform-origin:50% 50%;transition:transform .18s var(--ease),opacity .2s;cursor:default}
.lf[data-state=stale]{cursor:pointer}
.lf.hov{transform:translateY(-2px) scale(1.04);filter:url(#ls)}
.lf.off{opacity:.42}
.lf.gone{transition:transform 1s cubic-bezier(.5,0,.8,.4),opacity 1s ease-in;opacity:0}
.enter .lf{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i)*5ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.96)}}
.settle .lf:not(.gone){animation:settle .9s var(--ease) both;animation-delay:calc(var(--i)*4ms)}
@keyframes settle{0%{transform:none}35%{transform:translateY(3px)}100%{transform:none}}
.btn{cursor:pointer}.btn[data-btn=Clear].dim{opacity:.45;cursor:default}
.tip{position:absolute;z-index:3;pointer-events:none;background:#fbf8ef;border-radius:9px;padding:7px 10px;font-size:12px;line-height:1.35;color:var(--ink);
  box-shadow:0 0 0 .5px #4a564040,0 6px 16px #4a564026;white-space:nowrap;opacity:0;transform:translate(-50%,calc(-100% - 6px)) translateY(3px);transition:opacity .14s,transform .14s var(--ease)}
.tip.on{opacity:1;transform:translate(-50%,calc(-100% - 6px))}
.tip b{font-weight:600}.tip .m{color:var(--ink-2)}
.tip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
/* falling dithered leaves (behind the stage wash) */
.fall{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.fall svg{position:absolute;top:-40px;width:26px;height:16px;animation:drop var(--d) linear var(--dl) infinite}
.fall svg use{animation:spin calc(var(--d)/3) ease-in-out var(--dl) infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes drop{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--dx),calc(var(--sh) + 80px),0)}}
@keyframes spin{from{transform:rotate(-28deg)}to{transform:rotate(34deg)}}
.loaded .pop{animation:open 220ms var(--ease) both}
@keyframes open{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:none}}

@media (max-width:720px){
  :root{--inset:7px;--pw:min(100%,calc((var(--sh) - 290px)*.734))}
  .stage{grid-template-columns:1fr;grid-template-rows:auto auto;align-content:center;row-gap:clamp(14px,2.6dvh,28px);padding:0 14px;border-radius:20px}
  .copy{padding:0;text-align:center}
  h1{font-size:clamp(40px,7dvh,64px)}.tag{font-size:15px;margin-inline:auto;max-width:19em}
  .extra{margin:0 auto}
  .icon{margin-right:22px}.pop .caret{right:55px}.pop{transform-origin:calc(100% - 64px) 0}
}
/* canopy drift: one GPU transform on the canvas, no redraw; ~12px over 30s */
#scene{transform:none}
@media (prefers-reduced-motion:reduce){
  #scene{animation:none;transform:none}.fall{display:none}
  *,*::before,*::after{transition:none!important;animation:none!important}
  .loaded .pop{animation:fade 120ms linear both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="fd" width="4" height="4" patternUnits="userSpaceOnUse"><g fill="#3d4733" fill-opacity=".28"><rect width="1" height="1"/><rect x="2" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect y="2" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/></g></pattern>
  <symbol id="leaf" viewBox="0 0 40 24"><path d="M2,12.5C7,4.6 15,1.8 22,2.6C29,3.2 34.5,6.8 38,11.6C34.8,17.4 28.6,21.3 21.4,21.6C13.6,22 6.8,18.6 2,12.5Z"/><path d="M4,12.5C14,10.5 26,10.5 36,11.6" stroke="#f6f3ec" stroke-opacity=".35" stroke-width="1" fill="none"/></symbol>
</defs></svg>



<main class="stage">
<canvas id="scene" aria-hidden="true"></canvas>
<div class="fall" aria-hidden="true">
  <svg style="left:9%;--d:31s;--dl:-4s;--dx:60px" viewBox="0 0 40 24"><use href="#leaf" fill="#7d8a6a"/><use href="#leaf" fill="url(#fd)"/></svg>
  <svg style="left:27%;--d:38s;--dl:-21s;--dx:-40px;width:22px" viewBox="0 0 40 24"><use href="#leaf" fill="#c9a97e"/><use href="#leaf" fill="url(#fd)"/></svg>
  <svg style="left:48%;--d:34s;--dl:-12s;--dx:70px;width:20px" viewBox="0 0 40 24"><use href="#leaf" fill="#a6b092"/><use href="#leaf" fill="url(#fd)"/></svg>
  <svg style="left:71%;--d:41s;--dl:-30s;--dx:-55px" viewBox="0 0 40 24"><use href="#leaf" fill="#5a684c"/><use href="#leaf" fill="url(#fd)"/></svg>
  <svg style="left:90%;--d:36s;--dl:-8s;--dx:-30px;width:23px" viewBox="0 0 40 24"><use href="#leaf" fill="#b09268"/><use href="#leaf" fill="url(#fd)"/></svg>
</div>
  <section class="copy">
    <h1>Arborist</h1>
    <p class="tag">Visualise your worktrees and sweep away the ones you don't need.</p>
    <a class="cta" href="https://github.com/faooful/arborist">
      <span class="ic"><svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.5 7.5 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.8-3.7 4 .3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2"/></svg></span>
      Get it on GitHub
    </a>
  </section>

  <section class="extra" aria-label="Arborist menu bar popover">
    <button class="icon" type="button" aria-label="Arborist menu bar icon, 225 GB free. Toggle the popover" aria-expanded="true">
      <svg width="19" height="19" viewBox="0 0 20 20"><path d="M3,16C3,8 8,3 17,3C17,12 12,17 4,17Z" fill="#4a5640"/><path d="M4.5,15.5C8,12 11,9 14,6" stroke="#efeadf" stroke-opacity=".7" stroke-width=".9" fill="none" stroke-linecap="round"/></svg><span class="gb">225 GB</span>
    </button>
    <div class="pop">
      <svg class="caret" width="18" height="10" viewBox="0 0 16 9" aria-hidden="true"><path d="M0,9C3.5,9 5.6,1.6 8,1.6S12.5,9 16,9Z" fill="#f6f3ec"/><path d="M0,9C3.5,9 5.6,1.6 8,1.6S12.5,9 16,9" fill="none" stroke="#4a564038" stroke-width=".5"/></svg>
      <!-- ============================== PANEL ==============================
           Live demo = assets/panel.svg, `arborist render --busy` from faooful/arborist (Swift 6.0.3 on
           Linux) in a scratch copy with invented names, plus data-* hooks on each leaf (class="lf":
           data-id, data-name, data-bytes, data-state) and on the buttons (class="btn" data-btn=...),
           #barfill and #freetxt. JS fetches it and swaps it in for the PNG; the PNG stays as the no-JS fallback.
           All names are invented sample data.
           ================================================================== -->
      <img class="panel" src="assets/panel.png" width="480" height="654" alt="Arborist popover: 76 worktrees in 35 repos drawn as leaves, 7 stale, 225 GB free, with a Clear 7 button (invented sample data)">
      <div class="tip" role="status" aria-live="polite"></div>
    </div>
  </section>
</main>

<script>
// panel eases in from the icon once; resting state is open
requestAnimationFrame(()=>document.body.classList.add('loaded'));
// Canopy scene, animated (v5.3): leaves sway on a slow wind field, re-dithered every frame at 1/2 res
// (cell = 2 CSS px) with a screen-fixed 4x4 Bayer matrix to the H8 palette. ~15fps, paused when hidden
// or offscreen; reduced motion = one static frame.
(()=>{
  const cv=document.getElementById('scene'),P=[[246,243,236],[228,230,211],[201,208,189],[166,176,146],[125,138,106],[90,104,76],[74,86,64],[201,169,126],[176,146,104]];
  const B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5],RM=matchMedia('(prefers-reduced-motion: reduce)'),FPS=15;
  // palette lookup: 32 levels per channel -> nearest palette index (perceptual weights as before)
  const LUT=new Uint8Array(32768);for(let r=0;r<32;r++)for(let g=0;g<32;g++)for(let b=0;b<32;b++){let bi=0,bd=1e9;const R=r*8+4,G=g*8+4,Bb=b*8+4;
    for(let j=0;j<P.length;j++){const q=P[j],e=(R-q[0])**2*.3+(G-q[1])**2*.59+(Bb-q[2])**2*.11;if(e<bd){bd=e;bi=j}}LUT[r<<10|g<<5|b]=bi}
  let W,H,x,base,leaves,amp,im,run=false,vis=true,last=0,raf=0;
  window.__ft=[];
  function setup(){
    // backbuffer cap: cell = 2 CSS px up to the 1440x900 half-res budget (~728x458 px); on bigger screens the
    // cell grows in whole CSS px (integer S) so the backbuffer stays near that budget and the dither stays crisp.
    const O=8,st=cv.parentNode.getBoundingClientRect(),CAP=728*458,S=Math.max(2,Math.ceil(Math.sqrt((st.width+2*O)*(st.height+2*O)/CAP)));
    W=Math.ceil((st.width+2*O)/S);H=Math.ceil((st.height+2*O)/S);cv.width=W;cv.height=H;cv.style.width=W*S+'px';cv.style.height=H*S+'px';cv.dataset.cell=S;
    x=cv.getContext('2d',{willReadFrequently:true});let s=11;const rn=()=>(s=s*16807%2147483647)/2147483647;
    const r2=e=>{const b=e.getBoundingClientRect();return{cx:(b.left-st.left+O+b.width/2)/S,cy:(b.top-st.top+O+b.height/2)/S,rx:b.width/S,ry:b.height/S}};
    const cp=r2(document.querySelector('.copy')),pp=r2(document.querySelector('.pop .panel'));
    const ell=(px,py,c,k)=>Math.hypot((px-c.cx)/(c.rx*k),(py-c.cy)/(c.ry*k));
    const M=innerWidth<=720,field=(px,py)=>Math.min(ell(px,py,cp,M?.72:.95),ell(px,py,pp,M?.66:.82));
    // static layers: gradient floor (under the leaves) and the clearing glows (over them)
    base=document.createElement('canvas');base.width=W;base.height=H;const bx=base.getContext('2d');
    const g=bx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#a6b092');g.addColorStop(1,'#8f9c7c');bx.fillStyle=g;bx.fillRect(0,0,W,H);
    const glowC=document.createElement('canvas');glowC.width=W;glowC.height=H;const gx=glowC.getContext('2d');
    const glow=(c,k,col)=>{const R=Math.max(c.rx,c.ry)*k,gr=gx.createRadialGradient(c.cx,c.cy,0,c.cx,c.cy,R);gr.addColorStop(0,col+'ff');gr.addColorStop(.55,col+'f0');gr.addColorStop(1,col+'00');
      gx.save();gx.translate(c.cx,c.cy);gx.scale(c.rx/Math.max(c.rx,c.ry),c.ry/Math.max(c.rx,c.ry));gx.translate(-c.cx,-c.cy);gx.fillStyle=gr;gx.fillRect(-W*3,-H*3,W*7,H*7);gx.restore()};
    glow(pp,1.05,'#d3d9c6');glow(cp,1.1,'#f6f3ec');base.glow=glowC;
    const cols=['#4a5640','#5a684c','#5a684c','#7d8a6a','#7d8a6a','#a6b092','#b09268'];
    leaves=[];const n=Math.round(W*H/90);
    for(let i=0;i<n;i++){const px=rn()*W,py=rn()*H,f=field(px,py);if(f<.75)continue;
      leaves.push({px,py,sz:(9+rn()*13)*Math.min(1.5,.75+f*.3),a:rn()*6.283,c:cols[Math.floor(rn()*cols.length)],al:.75+rn()*.25,
        k:Math.min(1,(f-.75)/.6)})} // k: sway strength, 0 at the clearing rim so the clearings stay calm
    amp=new Float32Array(W*H);for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){const T=B[(yy&3)*4+(xx&3)]/16-.47;amp[yy*W+xx]=T*(8+26*Math.min(1,Math.max(0,(field(xx,yy)-.55)/.5)))}
    frame(0);
  }
  // wind: two slow travelling waves; nearby leaves share phase so they move together
  const wind=(px,py,t)=>Math.sin(px*.021+py*.007-t*.55)*.6+Math.sin(px*.009-py*.017-t*.31+1.7)*.4;
  function frame(t){
    const t0=performance.now();
    x.globalAlpha=1;x.drawImage(base,0,0);
    const DX=Math.sin(t*.07)*3,DY=Math.cos(t*.053)*2; // slow whole-canopy drift (~6 CSS px each way), pattern stays fixed
    for(const l of leaves){const w=wind(l.px,l.py,t)*l.k,g2=wind(l.py,l.px,t*.8)*l.k;
      x.setTransform(Math.cos(l.a+w*.16),Math.sin(l.a+w*.16),-Math.sin(l.a+w*.16),Math.cos(l.a+w*.16),l.px+w*1.6+DX*l.k,l.py+g2*1.1+DY*l.k);
      const sz=l.sz;x.fillStyle=l.c;x.globalAlpha=l.al;x.beginPath();x.moveTo(-sz,0);x.quadraticCurveTo(0,-sz*.6,sz,0);x.quadraticCurveTo(0,sz*.6,-sz,0);x.fill();
      x.strokeStyle='#f6f3ec';x.globalAlpha=.16;x.lineWidth=.6;x.beginPath();x.moveTo(-sz*.85,0);x.lineTo(sz*.85,0);x.stroke()}
    x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.drawImage(base.glow,0,0);
    im=x.getImageData(0,0,W,H);const d=im.data,N=W*H;
    for(let i=0,k=0;i<N;i++,k+=4){const t2=amp[i];let r=d[k]+t2,g=d[k+1]+t2,b=d[k+2]+t2;
      r=r<0?0:r>255?255:r;g=g<0?0:g>255?255:g;b=b<0?0:b>255?255:b;const q=P[LUT[(r>>3)<<10|(g>>3)<<5|(b>>3)]];d[k]=q[0];d[k+1]=q[1];d[k+2]=q[2]}
    x.putImageData(im,0,0);
    __ft.push(performance.now()-t0);if(__ft.length>120)__ft.shift();
  }
  function loop(now){raf=0;if(!run)return;if(now-last>=1000/FPS-2){last=now;frame(now/1000)}raf=requestAnimationFrame(loop)}
  function update(){const go=!RM.matches&&vis&&!document.hidden&&!!x;if(go&&!run){run=true;raf||(raf=requestAnimationFrame(loop))}else if(!go){run=false}}
  new IntersectionObserver(e=>{vis=e[0].isIntersecting;update()}).observe(cv);
  document.addEventListener('visibilitychange',update);RM.addEventListener('change',()=>{update();if(RM.matches)frame(0)});
  addEventListener('load',()=>{setup();update()});let tm;addEventListener('resize',()=>{clearTimeout(tm);tm=setTimeout(()=>{setup();update()},150)});
})();
</script>
<script>
// Live demo panel (sample data). Hover = tooltip; click a stale leaf = toggle; Clear N = fall + free space up;
// Rescan = reset; menu-bar icon = close/reopen. Reduced motion: instant state changes.
(()=>{
  const pop=document.querySelector('.pop'),tip=pop.querySelector('.tip'),icon=document.querySelector('.icon'),gb=icon.querySelector('.gb');
  const RM=matchMedia('(prefers-reduced-motion: reduce)');
  const fmt=b=>{const u=['B','KB','MB','GB','TB'];let v=b,i=0;while(v>=1000&&i<4){v/=1000;i++}return i?(v>=100?v.toFixed(0):v.toFixed(1))+' '+u[i]:b+' B'};
  const STATE={clean:['Clean','#c9d0bd'],protected:['Uncommitted','#7d8a6a'],stale:['Stale','#c9a97e']};
  const repoOf=id=>{let m=id.match(/workspaces\/([^/]+)\//)||id.match(/\/code\/([^/]+)/)||id.match(/\/tmp\/([a-z-]+?)-[a-z]/);return m?m[1]:'repo'};
  const TOTAL=995e9,FREE0=225e9;let src,svg,wrap,free;
  const T=(t)=>[...svg.querySelectorAll('text,tspan')].find(e=>e.textContent===t);
  function mount(anim){
    wrap=document.createElement('div');wrap.className='panel';wrap.innerHTML=src;svg=wrap.firstElementChild;
    svg.removeAttribute('width');svg.removeAttribute('height');svg.setAttribute('role','img');
    svg.setAttribute('aria-label','Arborist popover with 76 worktrees drawn as leaves (sample data)');
    pop.querySelector('.panel').replaceWith(wrap);free=FREE0;
    const h=T('· 7 stale'),rd=T('Ready (7)'),rc=T('7 · 674 MB'),bar=svg.getElementById('barfill');
    const wt=T('76 worktrees'),wc=T('76 in 35 repos'),sl=[...svg.querySelectorAll('text')].find(e=>e.textContent==='Stale'&&e.getAttribute('font-size')==='10');
    const sv=sl&&[...svg.querySelectorAll('text')].find(e=>e.getAttribute('x')===sl.getAttribute('x')&&e.getAttribute('font-size')==='11.5'&&+e.getAttribute('y')>+sl.getAttribute('y'));
    Object.assign(svg,{wt,wc,sv,h,rd,rc,bar,bw:+bar.getAttribute('width')/(1-FREE0/TOTAL)});
    svg.querySelectorAll('.lf').forEach((g,i)=>{g.style.setProperty('--i',i);if(g.dataset.state==='stale')g.classList.add('sel')});
    if(anim&&!RM.matches){wrap.classList.add('enter');setTimeout(()=>wrap.classList.remove('enter'),1100)}
    sync(free);
  }
  const sel=()=>[...svg.querySelectorAll('.lf.sel:not(.gone)')];
  function sync(f,live){
    const n=sel().length,b=sel().reduce((a,g)=>a+ +g.dataset.bytes,0),left=svg.querySelectorAll('.lf[data-state=stale]:not(.gone)').length;
    const c=svg.querySelector('.btn[data-btn=Clear]');c.querySelector('text').textContent='Clear '+n;c.classList.toggle('dim',!n);
    const all=svg.querySelectorAll('.lf:not(.gone)').length;if(svg.wt)svg.wt.textContent=all+' worktrees';if(svg.wc)svg.wc.textContent=all+' in 35 repos';if(svg.sv)svg.sv.textContent=left;
    if(svg.h)svg.h.textContent='· '+left+' stale';if(svg.rd)svg.rd.textContent='Ready ('+n+')';if(svg.rc)svg.rc.textContent=n+' · '+fmt(b);
    // while counting up, show one decimal so a sub-GB gain visibly ticks (the app's whole-GB format returns at rest)
    const ff=live?(f/1e9).toFixed(1)+' GB':fmt(f);gb.textContent=ff;const ft=svg.getElementById('freetxt');if(ft)ft.textContent=ff;
    svg.bar.setAttribute('width',(svg.bw*(1-f/TOTAL)).toFixed(1));
  }
  function showTip(g){
    const [lab,col]=STATE[g.dataset.state]||['',''],r=g.getBoundingClientRect(),p=pop.getBoundingClientRect();
    tip.innerHTML='<b>'+repoOf(g.dataset.id)+'</b> <span class="m">/</span> '+g.dataset.name+'<br><span class="m"><i style="background:'+col+'"></i>'+lab+' · '+fmt(+g.dataset.bytes)+(g.dataset.state==='stale'?(g.classList.contains('sel')?' · selected':' · tap to select'):'')+'</span>';
    let x=r.left+r.width/2-p.left;x=Math.max(90,Math.min(p.width-90,x));
    tip.style.left=x+'px';tip.style.top=(r.top-p.top)+'px';tip.classList.add('on');
  }
  let hov=null,tt;
  const hover=g=>{if(hov===g)return;hov&&hov.classList.remove('hov');hov=g;if(g){g.classList.add('hov');g.parentNode.appendChild(g);showTip(g)}else tip.classList.remove('on')};
  pop.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||!svg)return;hover(e.target.closest('.lf:not(.gone)'))});
  pop.addEventListener('pointerleave',()=>hover(null));
  pop.addEventListener('click',e=>{
    if(!svg)return;const g=e.target.closest('.lf:not(.gone)'),b=e.target.closest('.btn');
    if(g){if(g.dataset.state==='stale'){g.classList.toggle('sel');g.classList.toggle('off');sync(free)}
      hov=null;hover(g);clearTimeout(tt);if(e.pointerType!=='mouse')tt=setTimeout(()=>hover(null),2600);return}
    if(b&&b.dataset.btn==='Clear')clear();
    if(b&&b.dataset.btn==='Rescan'){hover(null);mount(true)}
  });
  function clear(){
    const gs=sel();if(!gs.length)return;hover(null);
    const add=gs.reduce((a,g)=>a+ +g.dataset.bytes,0),f0=free,f1=free+add;free=f1;
    gs.forEach((g,i)=>{g.classList.remove('sel');g.classList.add('gone');g.style.transform='translate('+((i%2?1:-1)*(8+i*3))+'px,70px) rotate('+((i%2?1:-1)*(20+i*4))+'deg)'});
    const done=()=>{gs.forEach(g=>g.style.visibility='hidden')};
    if(RM.matches){sync(f1);done();return}
    sync(f0);const t0=performance.now(),D=1100;
    const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);sync(f0+(f1-f0)*e,k<1);k<1?requestAnimationFrame(step):0};requestAnimationFrame(step);
    setTimeout(()=>{wrap.classList.add('settle');setTimeout(()=>wrap.classList.remove('settle'),1300)},520);setTimeout(done,1050);
  }
  icon.addEventListener('click',()=>{const shut=pop.classList.toggle('shut');icon.setAttribute('aria-expanded',!shut);hover(null);
    if(!shut&&wrap&&!RM.matches){wrap.classList.remove('enter');void wrap.offsetWidth;wrap.classList.add('enter');setTimeout(()=>wrap.classList.remove('enter'),1100)}});
  pop.addEventListener('animationend',e=>{if(e.target===pop)document.body.classList.remove('loaded')});
  fetch('assets/panel.svg').then(r=>r.ok?r.text():Promise.reject()).then(t=>{src=t;mount(false)}).catch(()=>{});
})();
</script>
